<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Two 2.0HP units installed on a wall bracket with copper tubing</title>
  <defs>
    <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/><stop offset="1" stop-color="#d6e3f5"/>
    </linearGradient>
    <linearGradient id="gCu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9975a"/><stop offset=".5" stop-color="#f0bd83"/><stop offset="1" stop-color="#c07f42"/>
    </linearGradient>
    <linearGradient id="gUnit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e5edf8"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0a1f44" flood-opacity=".2"/>
    </filter>
    <g id="outdoor">
      <rect x="0" y="0" width="220" height="238" rx="15" fill="url(#gUnit)" stroke="#d4e0ef" stroke-width="2"/>
      <rect x="11" y="11" width="198" height="28" rx="9" fill="#eef4fc" stroke="#d7e2f0"/>
      <g stroke="#c3d3e8" stroke-width="2" stroke-linecap="round"><path d="M24 19h172M24 31h172"/></g>
      <circle cx="110" cy="140" r="56" fill="#eef4fc" stroke="#cddbec" stroke-width="3"/>
      <g fill="#c5d6ec">
        <rect x="104" y="92" width="12" height="50" rx="6" transform="rotate(0 110 140)"/>
        <rect x="104" y="92" width="12" height="50" rx="6" transform="rotate(45 110 140)"/>
        <rect x="104" y="92" width="12" height="50" rx="6" transform="rotate(90 110 140)"/>
        <rect x="104" y="92" width="12" height="50" rx="6" transform="rotate(135 110 140)"/>
      </g>
      <circle cx="110" cy="140" r="11" fill="#9db4d2"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#gWall)"/>
  <path d="M0 0h280L0 420Z" fill="#fff" opacity=".45"/>

  <!-- mounting brackets -->
  <g stroke="#8fa6c6" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M118 300v96M262 300v96M74 340h44M226 340h44M92 392h64"/>
    <path d="M452 300v96M596 300v96M408 340h44M560 340h44M426 392h64"/>
  </g>

  <!-- two condenser units on brackets -->
  <g filter="url(#sh)">
    <g transform="translate(86 214) scale(.78)">
      <use href="#outdoor"/>
      <rect x="60" y="198" width="30" height="40" rx="5" fill="#5f7a9e"/>
    </g>
    <g transform="translate(420 214) scale(.78)">
      <use href="#outdoor"/>
      <rect x="60" y="198" width="30" height="40" rx="5" fill="#5f7a9e"/>
    </g>
  </g>

  <!-- copper lines + communication wire + drain pipe -->
  <g fill="none" stroke-linecap="round">
    <path d="M176 214V128c0-24 18-38 40-44" stroke="url(#gCu)" stroke-width="11"/>
    <path d="M196 214V136c0-18 14-28 32-34" stroke="url(#gCu)" stroke-width="7"/>
    <path d="M510 214V128c0-24 18-38 40-44" stroke="url(#gCu)" stroke-width="11"/>
    <path d="M530 214V136c0-18 14-28 32-34" stroke="url(#gCu)" stroke-width="7"/>
    <path d="M216 216v92c0 20-12 32-30 40" stroke="#8fa6c6" stroke-width="6"/>
    <path d="M550 216v92c0 20-12 32-30 40" stroke="#8fa6c6" stroke-width="6"/>
    <path d="M186 218v70c0 18-10 28-26 36" stroke="#0f2a52" stroke-width="5" stroke-dasharray="14 9"/>
    <path d="M520 218v70c0 18-10 28-26 36" stroke="#0f2a52" stroke-width="5" stroke-dasharray="14 9"/>
  </g>

  <!-- indoor units above -->
  <g filter="url(#sh)">
    <g transform="translate(96 36) scale(.72)">
      <rect width="300" height="94" rx="18" fill="url(#gUnit)" stroke="#d9e3f1" stroke-width="2"/>
      <path d="M20 9h260a9 9 0 0 1 9 9v11H11V18a9 9 0 0 1 9-9Z" fill="#fff" opacity=".9"/>
      <rect x="12" y="50" width="276" height="27" rx="13.5" fill="#e3ecf9" stroke="#cfdcee" stroke-width="1.5"/>
      <g stroke="#b9cbe6" stroke-width="2" stroke-linecap="round"><path d="M32 59h236M32 68h236"/></g>
      <rect x="234" y="18" width="48" height="25" rx="7" fill="#102a58"/>
      <text x="258" y="35.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7db4ff">2.0HP</text>
    </g>
    <g transform="translate(430 36) scale(.72)">
      <rect width="300" height="94" rx="18" fill="url(#gUnit)" stroke="#d9e3f1" stroke-width="2"/>
      <path d="M20 9h260a9 9 0 0 1 9 9v11H11V18a9 9 0 0 1 9-9Z" fill="#fff" opacity=".9"/>
      <rect x="12" y="50" width="276" height="27" rx="13.5" fill="#e3ecf9" stroke="#cfdcee" stroke-width="1.5"/>
      <g stroke="#b9cbe6" stroke-width="2" stroke-linecap="round"><path d="M32 59h236M32 68h236"/></g>
      <rect x="234" y="18" width="48" height="25" rx="7" fill="#102a58"/>
      <text x="258" y="35.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7db4ff">2.0HP</text>
    </g>
  </g>

  <!-- ground line -->
  <rect y="446" width="800" height="12" fill="#b6c7de"/>
  <rect y="458" width="800" height="142" fill="#bcd0e7"/>
</svg>