<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Residential air-conditioning installation in a living room</title>
  <defs>
    <linearGradient id="gRoom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf7"/><stop offset="1" stop-color="#efe8dd"/>
    </linearGradient>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b49a"/><stop offset="1" stop-color="#b39c81"/>
    </linearGradient>
    <linearGradient id="gUnit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7edf6"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#3b2c1a" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="800" height="440" fill="url(#gRoom)"/>
  <rect y="432" width="800" height="10" fill="#d9cbb6"/>
  <rect y="442" width="800" height="158" fill="url(#gFloor)"/>

  <!-- picture frame -->
  <rect x="576" y="118" width="150" height="112" rx="6" fill="#fff" stroke="#d6c4a8" stroke-width="6"/>
  <path d="M594 214l38-44 28 26 22-18 34 36Z" fill="#b7d0ec"/>

  <!-- wall-mounted split unit -->
  <g transform="translate(72 84) scale(.98)" filter="url(#sh)">
    <rect width="300" height="94" rx="18" fill="url(#gUnit)" stroke="#dbe3ef" stroke-width="2"/>
    <path d="M20 9h260a9 9 0 0 1 9 9v11H11V18a9 9 0 0 1 9-9Z" fill="#fff" opacity=".9"/>
    <rect x="12" y="50" width="276" height="27" rx="13.5" fill="#e3ecf9" stroke="#cfdcee" stroke-width="1.5"/>
    <g stroke="#b9cbe6" stroke-width="2" stroke-linecap="round"><path d="M32 59h236M32 68h236"/></g>
    <rect x="234" y="18" width="48" height="25" rx="7" fill="#102a58"/>
    <text x="258" y="35.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7db4ff">22&#176;</text>
    <circle cx="26" cy="30" r="4.5" fill="#22c55e"/>
  </g>

  <!-- cool air -->
  <g stroke="#1a7bff" fill="none" stroke-linecap="round" opacity=".28">
    <path d="M118 200c-20 26-20 50 0 76" stroke-width="7"/>
    <path d="M196 200c-20 26-20 50 0 76" stroke-width="7"/>
    <path d="M274 200c-20 26-20 50 0 76" stroke-width="7"/>
  </g>

  <!-- technician on ladder -->
  <g stroke="#9aa8bd" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M470 450 502 232"/><path d="M520 450 532 232"/>
  </g>
  <g stroke="#b6c2d4" stroke-width="4" stroke-linecap="round">
    <path d="M478 412h22M484 378h20M490 344h16M496 310h14M500 276h12"/>
  </g>
  <g transform="translate(452 176) scale(.9)">
    <rect x="52" y="242" width="25" height="88" rx="11" fill="#17356b"/>
    <rect x="95" y="242" width="25" height="88" rx="11" fill="#17356b"/>
    <rect x="46" y="316" width="34" height="16" rx="7" fill="#0a1f44"/>
    <rect x="92" y="316" width="34" height="16" rx="7" fill="#0a1f44"/>
    <rect x="38" y="140" width="96" height="108" rx="24" fill="#0b62d6"/>
    <rect x="48" y="186" width="76" height="10" rx="5" fill="#7db4ff" opacity=".55"/>
    <rect x="14" y="150" width="20" height="94" rx="10" fill="#0b62d6" transform="rotate(20 24 196)"/>
    <rect x="106" y="76" width="19" height="92" rx="9.5" fill="#0a4fbb" transform="rotate(12 116 160)"/>
    <circle cx="138" cy="76" r="10" fill="#f0c3a0"/>
    <circle cx="22" cy="152" r="10" fill="#f0c3a0"/>
    <rect x="77" y="126" width="18" height="22" rx="8" fill="#e8b894"/>
    <circle cx="86" cy="110" r="24" fill="#f0c3a0"/>
    <path d="M60 106a26 26 0 0 1 52 0v6H60Z" fill="#0a1f44"/>
    <rect x="52" y="106" width="68" height="9" rx="4.5" fill="#17356b"/>
  </g>
  <!-- drill -->
  <g transform="rotate(-28 552 250)">
    <rect x="526" y="232" width="56" height="26" rx="7" fill="#0a1f44"/>
    <rect x="580" y="240" width="18" height="12" rx="4" fill="#2a4a7c"/>
    <rect x="596" y="243" width="30" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="540" y="256" width="19" height="28" rx="6" fill="#1f3a63"/>
  </g>

  <!-- sofa -->
  <g filter="url(#sh)">
    <rect x="44" y="356" width="272" height="94" rx="18" fill="#2f4f77"/>
    <rect x="64" y="322" width="106" height="60" rx="14" fill="#3d6392"/>
    <rect x="180" y="322" width="106" height="60" rx="14" fill="#3d6392"/>
    <rect x="58" y="440" width="18" height="26" rx="6" fill="#7a5a3c"/>
    <rect x="284" y="440" width="18" height="26" rx="6" fill="#7a5a3c"/>
  </g>

  <!-- plant -->
  <g transform="translate(636 356)">
    <path d="M40 84c-16-22-14-42 4-56M40 84c14-24 12-44-6-56M40 84c0-26 4-42 12-52" stroke="#3f9d6b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M12 84h56l-8 44H20Z" fill="#c98b5e"/>
  </g>

  <!-- rug -->
  <path d="M120 486h560l54 74H66Z" fill="#e4d6c1" opacity=".7"/>
</svg>