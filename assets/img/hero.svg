<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Technician installing a wall-mounted split-type air-conditioning unit</title>
  <desc id="d">Illustrative placeholder: a technician with a drill beside a newly mounted split-type aircon and an outdoor condenser unit.</desc>

  <defs>
    <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset=".55" stop-color="#e4eefb"/>
      <stop offset="1" stop-color="#d3e1f4"/>
    </linearGradient>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d3ea"/>
      <stop offset="1" stop-color="#a9bdd9"/>
    </linearGradient>
    <linearGradient id="gUnit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#e4ecf7"/>
    </linearGradient>
    <linearGradient id="gTech" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a7bff"/>
      <stop offset="1" stop-color="#0a4fbb"/>
    </linearGradient>
    <linearGradient id="gVig" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#0a1f44" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1f44" stop-opacity=".22"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a1f44" flood-opacity=".2"/>
    </filter>
    <filter id="shSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a1f44" flood-opacity=".18"/>
    </filter>

    <!-- indoor split-type unit -->
    <g id="indoor">
      <rect x="0" y="0" width="300" height="94" rx="18" fill="url(#gUnit)" stroke="#d9e3f1" stroke-width="2"/>
      <path d="M20 9h260a9 9 0 0 1 9 9v11H11V18a9 9 0 0 1 9-9Z" fill="#fff" opacity=".9"/>
      <rect x="12" y="50" width="276" height="27" rx="13.5" fill="#e3ecf9" stroke="#cfdcee" stroke-width="1.5"/>
      <g stroke="#b9cbe6" stroke-width="2" stroke-linecap="round">
        <path d="M32 59h236M32 68h236"/>
      </g>
      <rect x="234" y="18" width="48" height="25" rx="7" fill="#102a58"/>
      <text x="258" y="35.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7db4ff">22&#176;</text>
      <circle cx="26" cy="30" r="4.5" fill="#22c55e"/>
    </g>

    <!-- outdoor condenser unit -->
    <g id="outdoor">
      <rect x="0" y="0" width="220" height="238" rx="15" fill="url(#gUnit)" stroke="#d4e0ef" stroke-width="2"/>
      <rect x="11" y="11" width="198" height="28" rx="9" fill="#eef4fc" stroke="#d7e2f0"/>
      <g stroke="#c3d3e8" stroke-width="2" stroke-linecap="round">
        <path d="M24 19h172M24 31h172"/>
      </g>
      <circle cx="110" cy="140" r="60" fill="#eef4fc" stroke="#cddbec" stroke-width="3"/>
      <g fill="#c5d6ec">
        <rect x="104" y="88" width="12" height="52" rx="6" transform="rotate(0 110 140)"/>
        <rect x="104" y="88" width="12" height="52" rx="6" transform="rotate(45 110 140)"/>
        <rect x="104" y="88" width="12" height="52" rx="6" transform="rotate(90 110 140)"/>
        <rect x="104" y="88" width="12" height="52" rx="6" transform="rotate(135 110 140)"/>
      </g>
      <circle cx="110" cy="140" r="11" fill="#9db4d2"/>
      <rect x="26" y="234" width="30" height="12" rx="4" fill="#8fa6c6"/>
      <rect x="164" y="234" width="30" height="12" rx="4" fill="#8fa6c6"/>
    </g>
  </defs>

  <!-- wall & floor -->
  <rect width="1200" height="700" fill="url(#gWall)"/>
  <path d="M0 0h420L0 620Z" fill="#fff" opacity=".35"/>
  <path d="M760 0h300L1060 640H700Z" fill="#fff" opacity=".22"/>
  <rect y="688" width="1200" height="14" fill="#b6c7de"/>
  <rect y="702" width="1200" height="198" fill="url(#gFloor)"/>
  <path d="M0 702h1200" stroke="#9db2d0" stroke-width="2"/>

  <!-- wall-mounted indoor unit -->
  <g transform="translate(360 132) scale(2.16)" filter="url(#sh)">
    <use href="#indoor"/>
  </g>

  <!-- cool airflow -->
  <g stroke="#1a7bff" fill="none" stroke-linecap="round" opacity=".38">
    <path d="M470 372c-26 40-26 74 0 116" stroke-width="9"/>
    <path d="M560 372c-26 40-26 74 0 116" stroke-width="9"/>
    <path d="M650 372c-26 40-26 74 0 116" stroke-width="9"/>
    <path d="M740 372c-26 40-26 74 0 116" stroke-width="9"/>
  </g>
  <g stroke="#7db4ff" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M515 400c-14 24-14 44 0 68" stroke-width="5"/>
    <path d="M695 400c-14 24-14 44 0 68" stroke-width="5"/>
  </g>

  <!-- refrigerant lines from indoor to outdoor unit -->
  <g fill="none" stroke-linecap="round">
    <path d="M975 348v56c0 26-18 40-44 52" stroke="#b6c7de" stroke-width="9"/>
    <path d="M1005 350v70c0 30-26 44-56 58" stroke="#8fa6c6" stroke-width="6" stroke-dasharray="2 12"/>
  </g>

  <!-- drill hole / wall socket detail -->
  <rect x="118" y="470" width="26" height="34" rx="6" fill="#fff" stroke="#c4d3e8" stroke-width="2"/>
  <circle cx="131" cy="481" r="3" fill="#a9bcd8"/>
  <circle cx="131" cy="492" r="3" fill="#a9bcd8"/>

  <!-- technician -->
  <g transform="translate(170 346) scale(1.15)" filter="url(#shSm)">
    <!-- legs -->
    <rect x="52" y="242" width="25" height="88" rx="11" fill="#17356b"/>
    <rect x="95" y="242" width="25" height="88" rx="11" fill="#17356b"/>
    <rect x="46" y="316" width="34" height="16" rx="7" fill="#0a1f44"/>
    <rect x="92" y="316" width="34" height="16" rx="7" fill="#0a1f44"/>
    <!-- torso -->
    <rect x="38" y="140" width="96" height="108" rx="24" fill="url(#gTech)"/>
    <rect x="48" y="186" width="76" height="10" rx="5" fill="#7db4ff" opacity=".55"/>
    <rect x="48" y="212" width="76" height="10" rx="5" fill="#7db4ff" opacity=".35"/>
    <!-- raised arms -->
    <rect x="106" y="76" width="19" height="92" rx="9.5" fill="#0b62d6" transform="rotate(14 116 160)"/>
    <rect x="118" y="68" width="20" height="96" rx="10" fill="#0a4fbb" transform="rotate(28 128 162)"/>
    <circle cx="138" cy="78" r="10" fill="#f0c3a0"/>
    <circle cx="172" cy="80" r="10" fill="#f0c3a0"/>
    <!-- head + helmet -->
    <rect x="77" y="126" width="18" height="22" rx="8" fill="#e8b894"/>
    <circle cx="86" cy="110" r="24" fill="#f0c3a0"/>
    <path d="M60 106a26 26 0 0 1 52 0v6H60Z" fill="#0a1f44"/>
    <rect x="52" y="106" width="68" height="9" rx="4.5" fill="#17356b"/>
  </g>

  <!-- drill -->
  <g transform="rotate(-24 360 428)" filter="url(#shSm)">
    <rect x="336" y="404" width="58" height="28" rx="7" fill="#0a1f44"/>
    <rect x="392" y="412" width="20" height="13" rx="4" fill="#2a4a7c"/>
    <rect x="410" y="416" width="34" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="350" y="430" width="20" height="30" rx="6" fill="#1f3a63"/>
    <rect x="344" y="410" width="14" height="7" rx="3" fill="#22c55e"/>
  </g>

  <!-- outdoor condenser on pad -->
  <rect x="838" y="836" width="382" height="16" rx="8" fill="#9db2d0"/>
  <g transform="translate(846 440) scale(1.62)" filter="url(#sh)">
    <use href="#outdoor"/>
  </g>

  <!-- vignette -->
  <rect width="1200" height="900" fill="url(#gVig)"/>
</svg>