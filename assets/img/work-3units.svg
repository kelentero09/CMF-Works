<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">Three brand-new air-conditioning units installed in one day</title>
  <defs>
    <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#dbe7f8"/>
    </linearGradient>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6d5ec"/><stop offset="1" stop-color="#aac0dd"/>
    </linearGradient>
    <linearGradient id="gUnit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e5edf8"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1f44" flood-opacity=".18"/>
    </filter>
    <g id="indoor">
      <rect x="0" y="0" width="300" height="94" rx="18" fill="url(#gUnit)" stroke="#d9e3f1" stroke-width="2"/>
      <path d="M20 9h260a9 9 0 0 1 9 9v11H11V18a9 9 0 0 1 9-9Z" fill="#fff" opacity=".9"/>
      <rect x="12" y="50" width="276" height="27" rx="13.5" fill="#e3ecf9" stroke="#cfdcee" stroke-width="1.5"/>
      <g stroke="#b9cbe6" stroke-width="2" stroke-linecap="round"><path d="M32 59h236M32 68h236"/></g>
      <rect x="234" y="18" width="48" height="25" rx="7" fill="#102a58"/>
      <text x="258" y="35.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7db4ff">22&#176;</text>
      <circle cx="26" cy="30" r="4.5" fill="#22c55e"/>
    </g>
    <g id="outdoor">
      <rect x="0" y="0" width="220" height="238" rx="15" fill="url(#gUnit)" stroke="#d4e0ef" stroke-width="2"/>
      <rect x="11" y="11" width="198" height="28" rx="9" fill="#eef4fc" stroke="#d7e2f0"/>
      <g stroke="#c3d3e8" stroke-width="2" stroke-linecap="round"><path d="M24 19h172M24 31h172"/></g>
      <circle cx="110" cy="140" r="56" fill="#eef4fc" stroke="#cddbec" stroke-width="3"/>
      <g fill="#c5d6ec">
        <rect x="104" y="92" width="12" height="50" rx="6" transform="rotate(0 110 140)"/>
        <rect x="104" y="92" width="12" height="50" rx="6" transform="rotate(45 110 140)"/>
        <rect x="104" y="92" width="12" height="50" rx="6" transform="rotate(90 110 140)"/>
        <rect x="104" y="92" width="12" height="50" rx="6" transform="rotate(135 110 140)"/>
      </g>
      <circle cx="110" cy="140" r="11" fill="#9db4d2"/>
      <rect x="26" y="234" width="30" height="12" rx="4" fill="#8fa6c6"/>
      <rect x="164" y="234" width="30" height="12" rx="4" fill="#8fa6c6"/>
    </g>
  </defs>

  <rect width="800" height="440" fill="url(#gWall)"/>
  <path d="M0 0h300L0 340Z" fill="#fff" opacity=".4"/>
  <rect y="430" width="800" height="10" fill="#b6c7de"/>
  <rect y="440" width="800" height="160" fill="url(#gFloor)"/>

  <!-- three indoor units -->
  <g filter="url(#sh)">
    <use href="#indoor" transform="translate(46 78) scale(.8)"/>
    <use href="#indoor" transform="translate(292 78) scale(.8)"/>
    <use href="#indoor" transform="translate(538 78) scale(.8)"/>
  </g>

  <!-- ladder -->
  <g stroke="#93a8c6" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M132 446 168 168"/><path d="M182 446 200 168"/>
  </g>
  <g stroke="#b3c4dd" stroke-width="4" stroke-linecap="round">
    <path d="M140 404h22M147 363h20M154 322h16M160 281h15M166 240h13"/>
  </g>

  <!-- three condenser units -->
  <g filter="url(#sh)">
    <use href="#outdoor" transform="translate(238 236) scale(.86)"/>
    <use href="#outdoor" transform="translate(452 236) scale(.86)"/>
  </g>
  <g filter="url(#sh)">
    <use href="#outdoor" transform="translate(660 236) scale(.86)"/>
  </g>

  <!-- pipe runs -->
  <g fill="none" stroke-linecap="round">
    <path d="M166 168v72c0 18-10 30-26 40" stroke="#b6c7de" stroke-width="7"/>
    <path d="M700 168v40c0 16-8 26-22 34" stroke="#b6c7de" stroke-width="7"/>
  </g>

  <!-- toolbox -->
  <g transform="translate(56 470)">
    <rect x="0" y="12" width="86" height="42" rx="8" fill="#0a1f44"/>
    <rect x="0" y="12" width="86" height="10" rx="5" fill="#17356b"/>
    <path d="M26 12V4a8 8 0 0 1 8-8h18a8 8 0 0 1 8 8v8" fill="none" stroke="#0a1f44" stroke-width="6"/>
    <rect x="70" y="24" width="12" height="18" rx="3" fill="#7db4ff"/>
  </g>
</svg>